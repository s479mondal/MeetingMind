# =============================================================================
# MeetingMind - Spring Boot Configuration
# All sensitive values are loaded from the .env file / environment variables.
# =============================================================================

# Server
server.port=${SERVER_PORT:8080}

# MongoDB Atlas Connection
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:meetingmind}

# File Upload (allow up to 50MB audio files)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# OpenAI / ASR defaults (can be overridden via Settings UI or env vars)
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.openai.llm-model=${OPENAI_LLM_MODEL:gpt-4o-mini}
app.asr.provider=${ASR_PROVIDER:mock}

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.meetingmind=DEBUG
